name: Quality

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/quality.yml"
      - "app/**"
      - "db/**"
      - "drizzle/**"
      - "lib/**"
      - "optimizer/artifacts/**"
      - "sources/**"
      - "tests/**"
      - "wiki/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "vite.config.ts"
  pull_request:
    paths:
      - ".github/workflows/quality.yml"
      - "app/**"
      - "db/**"
      - "drizzle/**"
      - "lib/**"
      - "optimizer/artifacts/**"
      - "sources/**"
      - "tests/**"
      - "wiki/**"
      - "worker/**"
      - "package.json"
      - "package-lock.json"
      - "eslint.config.mjs"
      - "next.config.ts"
      - "postcss.config.mjs"
      - "tsconfig.json"
      - "vite.config.ts"

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out only the required revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          show-progress: false

      - name: Use Node.js with npm download cache
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint source files
        run: npm run lint:ci

      - name: Build once and run all tests
        run: npm test
